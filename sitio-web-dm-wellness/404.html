*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--linen);color:var(--ink);font-family:"Figtree",-apple-system,BlinkMacSystemFont,sans-serif;display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}

.btn:hover{transform:translateY(-1px)}
.p{background:var(--orchid);color:#fff}
.o{border-color:var(--line);color:var(--plum);background:var(--paper)}
.links{margin-top:34px;padding-top:22px;border-top:1px solid var(--line);font-size:.86rem;color:var(--muted)}
.links a{color:var(--orchid);text-decoration:none;margin-inline:7px}
:focus-visible{outline:2.5px solid var(--orchid);outline-offset:3px}
