<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="TEVE Transfers &amp; Tours">
  <defs>
    <linearGradient id="plumaje" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c6dcfd"/>
      <stop offset="55%" stop-color="#a3c6fb"/>
      <stop offset="100%" stop-color="#7aacf5"/>
    </linearGradient>
    <linearGradient id="plumajeHondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fbaf8"/>
      <stop offset="100%" stop-color="#5f97ef"/>
    </linearGradient>
    <path id="arcoSuperior" d="M 52.9 273 A 190 190 0 1 1 427.1 273" fill="none"/>
    <path id="arcoInferior" d="M 72.3 318.2 A 185 185 0 0 0 407.7 318.2" fill="none"/>
  </defs>

  <!-- anillo exterior -->
  <circle cx="240" cy="240" r="228" fill="none" stroke="#ffffff" stroke-width="7"/>

  <!-- anillos interiores partidos -->
  <path d="M 104.1 176.6 A 150 150 0 0 1 375.9 176.6" fill="none" stroke="#ffffff" stroke-width="2.4"/>
  <path d="M 104.1 303.4 A 150 150 0 0 0 375.9 303.4" fill="none" stroke="#ffffff" stroke-width="2.4"/>

  <!-- guacamaya -->
  <g transform="translate(22,6) scale(0.84)">
    <!-- cola larga inferior -->
    <path d="M272 256c14 46 6 89-22 128-11 15-25 28-42 38 24-35 38-67 44-97 6-30 5-53-6-69z" fill="url(#plumajeHondo)"/>
    <!-- barrido principal del cuerpo -->
    <path d="M305 198c4 74-44 128-167 138 84-30 134-72 149-140z" fill="url(#plumaje)"/>
    <!-- ala superior -->
    <path d="M293 210c-4 48-42 84-110 102 55-32 89-66 102-104z" fill="url(#plumajeHondo)"/>
    <!-- plumas medias -->
    <path d="M278 266c-2 32-26 58-68 76 34-27 56-52 64-78z" fill="url(#plumaje)"/>
    <!-- cabeza con penacho -->
    <path d="M256 198c-10-43 15-74 52-74 34 0 59 26 57 59-1 22-15 40-35 48-6-17-19-29-37-31-15-2-28 1-37 10z" fill="url(#plumaje)"/>
    <!-- pico ganchudo -->
    <path d="M352 155c19-1 33 12 33 29 0 16-12 28-28 29 8-9 12-19 11-30-1-11-7-21-16-28z" fill="url(#plumajeHondo)"/>
    <path d="M362 168c9 1 15 8 14 17-1 8-7 14-15 15 4-5 6-10 6-16 0-6-2-11-5-16z" fill="#5f97ef"/>
    <!-- ojo -->
    <circle cx="300" cy="160" r="7.5" fill="#02222e"/>
  </g>

  <!-- tipografía circular -->
  <g fill="#ffffff" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700">
    <text font-size="37" letter-spacing="7.5">
      <textPath href="#arcoSuperior" startOffset="50%" text-anchor="middle">TRANSFERS &amp; TOURS</textPath>
    </text>
    <text font-size="52" letter-spacing="17">
      <textPath href="#arcoInferior" startOffset="50%" text-anchor="middle">TEVE</textPath>
    </text>
  </g>
</svg>
