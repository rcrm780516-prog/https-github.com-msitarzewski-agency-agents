<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-label="TEVE Transfers &amp; Tours">
  <defs>
    <linearGradient id="plumaje" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c6dcfd"/>
      <stop offset="55%" stop-color="#a3c6fb"/>
      <stop offset="100%" stop-color="#7aacf5"/>
    </linearGradient>
    <linearGradient id="plumajeHondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fbaf8"/>
      <stop offset="100%" stop-color="#5f97ef"/>
    </linearGradient>
    <path id="arcoSuperior" d="M 52.9 273 A 190 190 0 1 1 427.1 273" fill="none"/>
    <path id="arcoInferior" d="M 72.3 318.2 A 185 185 0 0 0 407.7 318.2" fill="none"/>
  </defs>

  <!-- anillo exterior -->
  <circle cx="240" cy="240" r="228" fill="none" stroke="#0d0d0d" stroke-width="7"/>

  <!-- anillos interiores partidos -->
  <path d="M 104.1 176.6 A 150 150 0 0 1 375.9 176.6" fill="none" stroke="#0d0d0d" stroke-width="2.4"/>
  <path d="M 104.1 303.4 A 150 150 0 0 0 375.9 303.4" fill="none" stroke="#0d0d0d" stroke-width="2.4"/>

  <!-- guacamaya -->
  <g transform="translate(8,10) scale(0.9)">
    <!-- cola larga, la pluma más tenue y más al fondo -->
    <path d="M262 250c18 50 12 96-16 138-10 15-22 28-36 39 22-36 36-70 42-102 6-33 5-59-2-79z"
          fill="url(#plumajeHondo)" opacity="0.85"/>
    <!-- barrido principal del cuerpo: la pluma más grande y clara -->
    <path d="M300 196c8 82-48 140-186 152 96-32 152-84 168-158z" fill="url(#plumaje)"/>
    <!-- ala: se monta sobre el cuerpo con un tono más profundo -->
    <path d="M290 214c-2 52-48 90-124 110 62-36 100-72 116-114z" fill="url(#plumajeHondo)"/>
    <!-- plumas medias, dan el efecto de trazos superpuestos -->
    <path d="M280 262c0 34-28 62-76 82 40-30 64-58 72-86z" fill="url(#plumaje)"/>
    <path d="M270 300c-2 24-20 44-52 60 26-22 43-42 50-64z" fill="url(#plumajeHondo)" opacity="0.9"/>
    <!-- cabeza redonda con el penacho apenas insinuado -->
    <path d="M252 200c-12-46 16-80 58-80 38 0 65 29 63 65-1 25-17 45-40 54-7-19-21-32-41-34-17-2-31 1-40 11z"
          fill="url(#plumaje)"/>
    <!-- pico: bulto redondeado al costado derecho de la cabeza -->
    <path d="M355 152c22 0 38 16 38 36 0 19-14 34-33 35 11-10 17-23 16-37-1-13-8-25-21-34z"
          fill="url(#plumajeHondo)"/>
    <path d="M366 168c11 2 18 11 17 22-1 10-9 17-19 18 5-6 8-13 8-20 0-7-2-14-6-20z" fill="#5f97ef"/>
    <!-- ojo -->
    <circle cx="296" cy="160" r="8" fill="#0d0d0d"/>
  </g>

  <!-- tipografía circular -->
  <g fill="#0d0d0d" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700">
    <text font-size="37" letter-spacing="7.5">
      <textPath href="#arcoSuperior" startOffset="50%" text-anchor="middle">TRANSFERS &amp; TOURS</textPath>
    </text>
    <text font-size="52" letter-spacing="17">
      <textPath href="#arcoInferior" startOffset="50%" text-anchor="middle">TEVE</textPath>
    </text>
  </g>
</svg>
