name: Download Spa de Occidente Catalog

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/spa-occidente-catalog-redesign-9pou6o

      - name: Download PDF from Google Drive
        run: |
          FILE_ID="1OMMcj3HVnoOiuvQbYOZjjm9fLFiB5Zvj"
          mkdir -p assets
          # Handle large file confirmation
          curl -L \
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            -o assets/catalogo_spa_occidente.pdf
          ls -lh assets/catalogo_spa_occidente.pdf

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/catalogo_spa_occidente.pdf
          git commit -m "Add Spa de Occidente catalog PDF for redesign" || echo "Nothing to commit"
          git push origin claude/spa-occidente-catalog-redesign-9pou6o
